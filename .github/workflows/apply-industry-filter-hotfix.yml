name: Apply industry filter hotfix

on:
  push:
    branches:
      - fix/industry-filter-technical-context

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/industry-filter-technical-context
          fetch-depth: 0

      - name: Patch technical role evaluation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/utils/jobDrive.mjs')
          text = path.read_text()

          old = '''function isTargetTechnicalRole(job = {}) {
            const role = internshipRoleText(job);

            if (!role.trim()) {
              return isAlignedInternship(job);
            }

            if (matchesAny(OFF_TARGET_INTERNSHIP_ROLE_PATTERNS, role)) {
              return false;
            }

            return (
              matchesAny(ALIGNED_INTERNSHIP_PATTERNS, role) ||
              matchesAny(TARGET_ROLE_FALLBACK_PATTERNS, role)
            );
          }'''

          new = '''function isTargetTechnicalRole(job = {}) {
            const role = internshipRoleText(job);

            if (matchesAny(OFF_TARGET_INTERNSHIP_ROLE_PATTERNS, role)) {
              return false;
            }

            if (
              role.trim() &&
              matchesAny(TARGET_ROLE_FALLBACK_PATTERNS, role)
            ) {
              return true;
            }

            return isAlignedInternship(job);
          }'''

          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new in text:
              print('Hotfix already applied.')
          else:
              raise SystemExit('Expected isTargetTechnicalRole block not found')
          PY

      - name: Commit patch when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/jobDrive.mjs
          git commit -m "fix: evaluate internship technical context"
          git push origin HEAD:fix/industry-filter-technical-context
