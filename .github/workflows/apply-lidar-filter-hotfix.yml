name: Apply LiDAR filter hotfix

on:
  push:
    branches:
      - fix/industry-filter-technical-context

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/industry-filter-technical-context
          fetch-depth: 0

      - name: Add LiDAR and 3D sensing alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/utils/jobDrive.mjs')
          text = path.read_text()

          old = '''  /\\bcomputer vision\\b/i,
  /\\bvision artificielle\\b/i,
  /\\bimage processing\\b/i,'''
          new = '''  /\\bcomputer vision\\b/i,
  /\\blidar\\b/i,
  /\\b3d sensing\\b/i,
  /\\b3d perception\\b/i,
  /\\bvision artificielle\\b/i,
  /\\bimage processing\\b/i,'''

          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new in text:
              print('LiDAR alignment already present.')
          else:
              raise SystemExit('Expected computer vision alignment block not found')
          PY

      - name: Commit patch when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/jobDrive.mjs
          git commit -m "fix: recognize LiDAR and 3D sensing internships"
          git push origin HEAD:fix/industry-filter-technical-context
