name: Apply strict M2 targeting patch

on:
  push:
    branches:
      - fix/strict-m2-internship-gate

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'run strict M2 targeting patch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply strict targeting patch
        run: node scripts/apply-strict-m2-targeting.mjs

      - name: Verify tests
        run: npm test

      - name: Verify build
        run: npm run build

      - name: Verify diff
        run: git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/jobDrive.mjs apps-script/Discovery.gs apps-script/Scoring.gs
          git commit -m "fix: enforce strict M2 internship targeting"
          git push origin HEAD:fix/strict-m2-internship-gate
