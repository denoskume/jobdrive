name: Phase 2B AppPro one-shot patch

on:
  push:
    branches:
      - feature/phase2b-scoring-engine
    paths:
      - .github/workflows/phase2b-app-pro-patch.yml
      - scripts/phase2b-app-pro-patch.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase2b-scoring-engine
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic AppPro patch
        run: node scripts/phase2b-app-pro-patch.mjs

      - name: Commit patched AppPro and remove one-shot helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppPro.jsx
          git rm scripts/phase2b-app-pro-patch.mjs .github/workflows/phase2b-app-pro-patch.yml
          git commit -m "feat: integrate phase 2B fit intelligence dashboard"
          git push origin HEAD:feature/phase2b-scoring-engine
