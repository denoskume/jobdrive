name: Phase 2C Code mapping patch

on:
  push:
    branches:
      - feature/phase2c-action-center
    paths:
      - .github/workflows/phase2c-code-mapping-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase2c-action-center
          fetch-depth: 0
      - name: Patch Code.gs mapping
        run: |
          echo '' | base64 -d > /tmp/phase2c-code-mapping.py
          python3 /tmp/phase2c-code-mapping.py
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/phase2c-code-mapping-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose phase 2C metadata in apps script API"
          git push origin HEAD:feature/phase2c-action-center
