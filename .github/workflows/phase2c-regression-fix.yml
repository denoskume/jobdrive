name: Phase 2C regression fix

on:
  push:
    branches:
      - feature/phase2c-action-center
    paths:
      - .github/workflows/phase2c-regression-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase2c-action-center
          fetch-depth: 0

      - name: Patch Phase 2C regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path("src/jobdrive-dashboard.css")
          css = css_path.read_text()
          old_css = """grid-template-columns:\n    repeat(5, minmax(0,1fr));"""
          new_css = """grid-template-columns:\n    repeat(6, minmax(0,1fr));"""
          assert css.count(old_css) == 1, "Expected exactly one five-column KPI grid"
          css_path.write_text(css.replace(old_css, new_css, 1))

          app_path = Path("src/AppPro.jsx")
          app = app_path.read_text()

          old_import = """  calculateAnalytics,\n  filterInternships,\n  internshipSpecializations,\n  sortInternships,"""
          new_import = """  calculateAnalytics,\n  deadlineInfo,\n  filterInternships,\n  sortInternships,"""
          assert app.count(old_import) == 1, "Unexpected jobDrive import block"
          app = app.replace(old_import, new_import, 1)

          drawer_marker = "function JobDrawer({ job, saving, onClose, onSave }) {"
          helpers = r'''function priorityClass(priority) {
            if (priority === "Haute") return "high";
            if (priority === "Moyenne") return "medium";
            return "low";
          }

          function matchClass(score) {
            if (score >= 90) return "excellent";
            if (score >= 80) return "strong";
            return "moderate";
          }

          function DeadlineBadge({ deadline }) {
            const info = deadlineInfo(deadline);
            if (info.state === "none") {
              return <span className="pro-deadline neutral">No deadline</span>;
            }
            if (info.state === "expired") {
              return <span className="pro-deadline expired">Expired</span>;
            }
            if (info.days <= 3) {
              return <span className="pro-deadline urgent">Deadline · {info.days}d</span>;
            }
            if (info.days <= 7) {
              return <span className="pro-deadline soon">Deadline · {info.days}d</span>;
            }
            return <span className="pro-deadline">Deadline · {deadline}</span>;
          }

          function FollowUpBadge({ job }) {
            if (!job.followUpDate) return null;
            const info = deadlineInfo(job.followUpDate);
            if (info.state === "expired") {
              return <span className="pro-followup overdue">Follow-up overdue</span>;
            }
            if (info.state === "future" && info.days <= 2) {
              return <span className="pro-followup">Follow-up in {info.days}d</span>;
            }
            return <span className="pro-followup">Follow-up · {job.followUpDate}</span>;
          }

          '''
          assert app.count(drawer_marker) == 1, "JobDrawer marker not unique"
          assert "function DeadlineBadge" not in app
          app = app.replace(drawer_marker, helpers + drawer_marker, 1)

          old_score = r'''          <section className="pro-score-summary">
            <div>
              <span className="pro-match">{job.fitScore ? `${job.fitScore}% Match` : "No score"}</span>
              {job.priority && <span className="pro-priority">{job.priority}</span>}
            </div>
          </section>'''
          new_score = r'''          <section className="pro-score-summary">
            <div>
              <span className={`pro-match ${matchClass(job.fitScore)}`}>
                {job.fitScore ? `${job.fitScore}% Match` : "No score"}
              </span>
              {job.priority && (
                <span className={`pro-priority ${priorityClass(job.priority)}`}>
                  {job.priority}
                </span>
              )}
            </div>
            <DeadlineBadge deadline={job.deadline} />
          </section>

          <section className="pro-detail-grid">
            <div><small>Location</small><strong>{job.location || "Not specified"}</strong></div>
            <div><small>Mode</small><strong>{job.mode || "Not specified"}</strong></div>
            <div><small>Contract</small><strong>{job.contract || "Not specified"}</strong></div>
            <div><small>Compensation</small><strong>{job.compensation || "Not specified"}</strong></div>
            <div><small>Detected</small><strong>{job.detectedDate || "Unknown"}</strong></div>
            <div><small>Source</small><strong>{job.source || "Unknown"}</strong></div>
          </section>'''
          assert app.count(old_score) == 1, "Score summary block changed unexpectedly"
          app = app.replace(old_score, new_score, 1)

          old_followup_tail = r'''            </div>

            <label className="pro-field">
              <span>Private Notes</span>'''
          new_followup_tail = r'''            </div>

            <FollowUpBadge job={{ ...job, followUpDate: draft.followUpDate }} />

            <label className="pro-field">
              <span>Private Notes</span>'''
          assert app.count(old_followup_tail) == 1, "Follow-up field tail changed unexpectedly"
          app = app.replace(old_followup_tail, new_followup_tail, 1)

          for exact in [
            '  const [lastUpdated, setLastUpdated] = useState(null);\n',
            '      setLastUpdated(new Date());\n',
            '    setLastUpdated(new Date());\n',
            '  const specializations = useMemo(() => internshipSpecializations(jobs), [jobs]);\n',
            '  const metrics = useMemo(() => calculateAnalytics(jobs), [jobs]);\n',
          ]:
            assert exact in app, f"Expected cleanup target missing: {exact!r}"
            app = app.replace(exact, "", 1)

          hidden = r'''

      <span hidden aria-hidden="true">
        {/* Phase 2B Recommended ranking remains the default sort mode. */}
        <select value="recommended" readOnly>
          <option value="recommended">Recommended</option>
        </select>
        {specializations.length + metrics.total + Number(Boolean(lastUpdated))}
      </span>'''
          assert app.count(hidden) == 1, "Hidden test-only scaffold changed unexpectedly"
          app = app.replace(hidden, "", 1)

          app_path.write_text(app)
          PY

      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase2c-regression-fix.yml
          git add src/AppPro.jsx src/jobdrive-dashboard.css
          git diff --check
          git commit -m "fix: preserve phase 2C dashboard context"
          git push origin HEAD:feature/phase2c-action-center
