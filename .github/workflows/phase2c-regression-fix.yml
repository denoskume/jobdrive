name: Phase 2C regression fix

on:
  push:
    branches:
      - feature/phase2c-action-center
    paths:
      - .github/workflows/phase2c-regression-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase2c-action-center
          fetch-depth: 0
      - name: Apply focused regression patch
        run: python scripts/phase2c_regression_fix.py
      - name: Commit patch and clean helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase2c-regression-fix.yml scripts/phase2c_regression_fix.py
          git add src/AppPro.jsx src/jobdrive-dashboard.css
          git diff --check
          git commit -m "fix: preserve phase 2C dashboard context"
          git push origin HEAD:feature/phase2c-action-center
