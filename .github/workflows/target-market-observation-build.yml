name: Target Market Observation Build

on:
  push:
    branches:
      - feature/target-company-coverage-200
    paths:
      - scripts/apply-target-market-observation.mjs
      - .github/workflows/target-market-observation-build.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, 'remove target market observation bootstrap') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/target-company-coverage-200

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm raw observation contract is red before wiring
        shell: bash
        run: |
          set +e
          node --test tests/apps-script-target-company-runner.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected runner contract to fail before raw observation hook."
            exit 1
          fi
          echo "RED confirmed."

      - name: Apply raw market observation hook
        run: node scripts/apply-target-market-observation.mjs

      - name: Run target company tests
        run: >-
          node --test
          tests/apps-script-target-company-seeds.test.mjs
          tests/apps-script-target-companies-sheet.test.mjs
          tests/apps-script-target-company-coverage.test.mjs
          tests/apps-script-target-company-runner.test.mjs
          tests/target-companies-model.test.mjs
          tests/target-companies-api.test.mjs
          tests/target-companies-dashboard.test.mjs

      - name: Run full regression suite
        run: npm test

      - name: Build production bundle
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_JOBDRIVE_SPREADSHEET_ID: ${{ vars.VITE_JOBDRIVE_SPREADSHEET_ID }}
          VITE_JOBDRIVE_APPS_SCRIPT_URL: ${{ vars.VITE_JOBDRIVE_APPS_SCRIPT_URL }}
        run: npm run build

      - name: Commit verified discovery hook
        shell: bash
        run: |
          if git diff --quiet -- apps-script/Discovery.gs; then
            echo "No discovery wiring changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Discovery.gs
          git commit -m "feat: record raw market observations [generated-target-market-hook]"
          git push origin HEAD:feature/target-company-coverage-200
