<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JobDrive</title>

  <script>
    (function () {
      const repoBase = "/jobdrive/";
      const currentPath = window.location.pathname;

      if (currentPath !== repoBase) {
        window.location.replace(repoBase);
      }
    })();
  </script>
</head>

<body>
  <noscript>
    <p>
      Return to
      <a href="/jobdrive/">JobDrive</a>.
    </p>
  </noscript>
</body>
</html>
